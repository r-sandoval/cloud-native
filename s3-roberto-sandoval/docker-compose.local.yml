services:
  localstack:
    image: localstack/localstack:3.8
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
    ports: ["127.0.0.1:4566:4566"]
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "awslocal s3api head-bucket --bucket cloudnative-docs-local"]
      interval: 5s
      timeout: 5s
      retries: 20
  storage:
    build:
      context: ./storage-service
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: cloudnative-docs-local
      S3_ENDPOINT: http://localstack:4566
      EFS_PATH: /mnt/efs
    volumes:
      - ./.local/efs:/mnt/efs
    depends_on:
      localstack:
        condition: service_healthy
  documents:
    build:
      context: ./document-service
    ports: ["127.0.0.1:8080:8080"]
    environment:
      STORAGE_SERVICE_URL: http://storage:8081
    depends_on: [storage]
