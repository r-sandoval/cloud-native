
services:
  storage:
    platform: linux/amd64
    image: ${DOCKERHUB_USER}/cloudnative-storage:${IMAGE_TAG}
    container_name: cloudnative-storage
    restart: unless-stopped

    environment:
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      S3_BUCKET: ${S3_BUCKET}
      EFS_PATH: /mnt/efs
      SERVER_PORT: "8081"

    volumes:
      - /mnt/efs:/mnt/efs

    expose:
      - "8081"

    networks:
      - cloudnative

  documents:
    platform: linux/amd64
    image: ${DOCKERHUB_USER}/cloudnative-documents:${IMAGE_TAG}
    container_name: cloudnative-documents
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SERVER_PORT: "8080"
      STORAGE_SERVICE_URL: http://storage:8081

    depends_on:
      - storage

    networks:
      - cloudnative

networks:
  cloudnative:
    driver: bridge
